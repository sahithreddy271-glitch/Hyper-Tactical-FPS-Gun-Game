services:
  - type: web
    name: tactical-fps-coordinator
    runtime: node
    rootDir: coordinator
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SERVER_REGISTER_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false
